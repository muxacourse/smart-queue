<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Organization Login – Smart Queue</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="page">

    <!-- ===== Header ===== -->
    <header class="site-header site-header--split">
      <a href="../index.html" class="brand" aria-label="Smart Queue home">
        <span class="brand-logo">SQ</span>
        <span class="brand-name">Smart Queue</span>
      </a>
      <a href="../index.html" class="back-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Back to home
      </a>
    </header>

    <main class="main main--form">
      <section class="form-card form-card--narrow">

        <div class="login-step">
          <div class="form-head form-head--center">
            <div class="portal-icon portal-icon--sm">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-4h6v4"/><path d="M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/></svg>
            </div>
            <div>
              <h1 class="form-title">Organization login</h1>
              <p class="form-subtitle">We’ll send a one-time password (OTP) to verify it’s you.</p>
            </div>
          </div>

          <!-- action will point to your PHP file later, e.g. ../php/org_send_otp.php -->
          <form id="emailForm" class="form" action="#" method="post" novalidate data-role="organization" data-remember-key="sq_org_email">
            <div class="field">
              <label for="email">Official email</label>
              <input id="email" name="email" type="email" placeholder="office@organization.com" autocomplete="email" required>
              <small class="hint">Use the official email you registered with. We’ll send the OTP there.</small>
              <small class="error" data-for="email"></small>
            </div>

            <label class="check">
              <input type="checkbox" id="remember" name="remember" value="1">
              Remember me
            </label>

            <button type="submit" class="btn btn--solid btn--block">Send OTP</button>

            <p class="form-alt">New organization? <a href="register.html">Register organization</a></p>
          </form>
        </div>

      </section>
    </main>

    <footer class="site-footer">
      &copy; <span id="year">2026</span> Smart Queue &middot; Online queue management &amp; waiting estimation
    </footer>

  </div>

  <script src="../js/main.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
