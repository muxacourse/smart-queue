<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Profile – Smart Queue</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
  <link rel="stylesheet" href="../css/org.css">
</head>
<body class="admin-body org-body">
  <div class="admin-layout">

    <!-- ===== Sidebar ===== -->
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <span class="brand-logo">SQ</span>
        <span class="brand-name">Smart Queue</span>
      </div>

      <div class="org-card">
        <span class="org-card-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-4h6v4"/></svg></span>
        <span class="org-card-text">
          <span class="org-card-name" id="sideOrgName">Organization</span>
          <span class="org-card-sub" id="sideOrgSub"></span>
        </span>
      </div>

      <nav class="admin-nav" aria-label="Organization">
        <span class="admin-nav-label">Menu</span>
        <a href="dashboard.html" class="admin-nav-link"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
        <a href="live-queue.html" class="admin-nav-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>Live Queue</a>
        <a href="counters.html" class="admin-nav-link"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>Services / Counters</a>
        <a href="tokens.html" class="admin-nav-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a2 2 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a2 2 0 0 0 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg>Tokens</a>
        <a href="profile.html" class="admin-nav-link" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Profile</a>
      </nav>

      <a href="login.html" class="admin-nav-link admin-logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Logout</a>
    </aside>

    <!-- ===== Main ===== -->
    <main class="admin-main">
      <div class="page-head-row">
        <div class="admin-page-head">
          <h1>Profile</h1>
          <p>Your organization details.</p>
        </div>
      </div>

      <section class="admin-card profile-card">
        <form id="profileForm" class="form" novalidate>
          <div class="field">
            <label for="pName">Organization name</label>
            <input id="pName" name="org_name" type="text" required>
            <small class="error" data-for="org_name"></small>
          </div>

          <div class="field">
            <label for="pContact">Contact person name</label>
            <input id="pContact" name="contact_name" type="text" required>
            <small class="error" data-for="contact_name"></small>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="pEmail">Official email</label>
              <input id="pEmail" name="email" type="email" readonly class="is-locked">
              <small class="hint">Used for OTP login. It can’t be changed.</small>
            </div>

            <div class="field">
              <label for="pPhone">Phone number</label>
              <div class="input-group">
                <span class="input-prefix">+91</span>
                <input id="pPhone" name="phone" type="tel" inputmode="numeric" maxlength="10" required>
              </div>
              <small class="error" data-for="phone"></small>
            </div>
          </div>

          <div class="field">
            <label for="pAddress">Address</label>
            <textarea id="pAddress" name="address" rows="3" required></textarea>
            <small class="error" data-for="address"></small>
          </div>

          <div class="form-actions">
            <button type="submit" class="btn btn--solid">Save changes</button>
            <button type="button" class="btn btn--grey" id="profileReset">Cancel</button>
            <span class="save-note" id="saveNote" role="status"></span>
          </div>
        </form>
      </section>

      <footer class="admin-footer">
        &copy; <span id="year">2026</span> Smart Queue &middot; Online queue management &amp; waiting estimation
      </footer>
    </main>

  </div>

  <script src="../js/main.js"></script>
  <script src="../js/org-data.js"></script>
  <script src="../js/org-common.js"></script>
  <script src="../js/org-profile.js"></script>
</body>
</html>
