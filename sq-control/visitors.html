<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex, nofollow">
  <title>Visitors – Smart Queue Admin</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/admin.css">
</head>
<body class="admin-body">
  <div class="admin-layout">

    <!-- ===== Sidebar ===== -->
    <aside class="admin-sidebar">
      <div class="admin-brand">
        <span class="brand-logo">SQ</span>
        <span class="brand-name">Smart Queue</span>
        <span class="admin-badge">ADMIN</span>
      </div>

      <nav class="admin-nav" aria-label="Admin">
        <span class="admin-nav-label">Manage</span>
        <a href="dashboard.html" class="admin-nav-link"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="3" width="7" height="9" rx="1.5"/><rect x="14" y="3" width="7" height="5" rx="1.5"/><rect x="14" y="12" width="7" height="9" rx="1.5"/><rect x="3" y="16" width="7" height="5" rx="1.5"/></svg>Dashboard</a>
        <a href="tokens.html" class="admin-nav-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9a2 2 0 0 0 0 6v3a1 1 0 0 0 1 1h16a1 1 0 0 0 1-1v-3a2 2 0 0 0 0-6V6a1 1 0 0 0-1-1H4a1 1 0 0 0-1 1z"/><path d="M13 5v2M13 11v2M13 17v2"/></svg>Tokens</a>
        <a href="visitors.html" class="admin-nav-link" aria-current="page"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>Visitors</a>
        <a href="organizations.html" class="admin-nav-link"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 21h18"/><path d="M5 21V7l7-4 7 4v14"/><path d="M9 21v-4h6v4"/><path d="M9 10h.01M15 10h.01M9 14h.01M15 14h.01"/></svg>Organizations</a>
      </nav>

      <a href="login.html" class="admin-nav-link admin-logout"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><path d="M16 17l5-5-5-5"/><path d="M21 12H9"/></svg>Logout</a>
    </aside>

    <!-- ===== Main ===== -->
    <main class="admin-main admin-main--list">
      <div class="admin-page-head">
        <h1>Visitors</h1>
        <p>All registered visitors.</p>
      </div>

      <section class="admin-card admin-card--list" id="visitorsList">
        <div class="admin-toolbar">
          <label class="per-page">Show
            <select id="perPage">
              <option value="50" selected>50</option>
              <option value="100">100</option>
              <option value="150">150</option>
              <option value="200">200</option>
            </select>
            per page
          </label>

          <div class="toolbar-right">
            <div class="admin-search">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg>
              <input type="search" id="search" placeholder="Search name, email or phone" aria-label="Search name, email or phone">
            </div>
          </div>
        </div>

        <div class="table-wrap">
          <table class="admin-table">
            <thead><tr><th scope="col">#</th><th scope="col">Name</th><th scope="col">Email</th><th scope="col">Phone</th><th scope="col">Gender</th><th scope="col">Date of birth</th><th scope="col">Registered on</th></tr></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>

        <div class="admin-pager">
          <span id="pageInfo" class="page-info"></span>
          <nav id="pagination" class="pagination" aria-label="Pagination"></nav>
        </div>
      </section>

      <footer class="admin-footer">
        &copy; <span id="year">2026</span> Smart Queue &middot; Online queue management &amp; waiting estimation
      </footer>
    </main>

  </div>

  <script src="../js/main.js"></script>
  <script src="../js/admin-data.js"></script>
  <script src="../js/admin-list.js"></script>
</body>
</html>
