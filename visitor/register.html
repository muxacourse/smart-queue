<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Visitor Registration – Smart Queue</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
  <div class="page">

    <!-- ===== Header ===== -->
    <header class="site-header site-header--split">
      <a href="../index.html" class="brand" aria-label="Smart Queue home">
        <span class="brand-logo">SQ</span>
        <span class="brand-name">Smart Queue</span>
      </a>
      <a href="../index.html" class="back-link">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
        Back to home
      </a>
    </header>

    <main class="main main--form">
      <section class="form-card portal--visitor">

        <div class="form-head">
          <div class="portal-icon portal-icon--sm">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21v-1a6 6 0 0 1 6-6h4a6 6 0 0 1 6 6v1"/></svg>
          </div>
          <div>
            <h1 class="form-title">Create visitor account</h1>
            <p class="form-subtitle">Register to get digital tokens and track your turn live.</p>
          </div>
        </div>

        <!-- action will point to your PHP file later, e.g. ../php/visitor_register.php -->
        <form id="visitorRegisterForm" class="form" action="#" method="post" novalidate>

          <div class="field">
            <label for="name">Full name</label>
            <input id="name" name="name" type="text" placeholder="Enter your full name" autocomplete="name" required>
            <small class="error" data-for="name"></small>
          </div>

          <div class="field">
            <label for="address">Address</label>
            <textarea id="address" name="address" rows="3" placeholder="House no., street, city, PIN code" autocomplete="street-address" required></textarea>
            <small class="error" data-for="address"></small>
          </div>

          <div class="field-row">
            <fieldset class="field field--gender">
              <legend>Gender</legend>
              <div class="choice-group">
                <label class="choice"><input type="radio" name="gender" value="Male" required>Male</label>
                <label class="choice"><input type="radio" name="gender" value="Female">Female</label>
                <label class="choice"><input type="radio" name="gender" value="Other">Other</label>
              </div>
              <small class="error" data-for="gender"></small>
            </fieldset>

            <div class="field">
              <label for="dob">Date of birth</label>
              <input id="dob" name="dob" type="date" autocomplete="bday" required>
              <small class="error" data-for="dob"></small>
            </div>
          </div>

          <div class="field-row">
            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="you@example.com" autocomplete="email" required>
              <small class="error" data-for="email"></small>
            </div>

            <div class="field">
              <label for="phone">Phone number</label>
              <div class="input-group">
                <span class="input-prefix">+91</span>
                <input id="phone" name="phone" type="tel" placeholder="98765 43210" inputmode="numeric" maxlength="10" autocomplete="tel-national" required>
              </div>
              <small class="error" data-for="phone"></small>
            </div>
          </div>

          <label class="check">
            <input type="checkbox" id="remember" name="remember" value="1">
            Remember me
          </label>

          <button type="submit" class="btn btn--solid btn--block">Create account</button>

          <p class="form-alt">Already have an account? <a href="login.html">Login</a></p>
        </form>

      </section>
    </main>

    <footer class="site-footer">
      &copy; <span id="year">2026</span> Smart Queue &middot; Online queue management &amp; waiting estimation
    </footer>

  </div>

  <script src="../js/main.js"></script>
  <script src="../js/visitor-register.js"></script>
</body>
</html>
